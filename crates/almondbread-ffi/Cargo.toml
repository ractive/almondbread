[package]
name = "almondbread-ffi"
description = "UniFFI surface of the almondbread Rust core for the Swift UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "almondbread_ffi"

[dependencies]
almondbread-core.workspace = true
almondbread-render.workspace = true
uniffi.workspace = true
thiserror = "2"
serde_json = "1"

[lints]
workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
# (Tests make an Explorer on a windowless layer.)
objc2 = "0.6"
objc2-quartz-core = "0.3"
