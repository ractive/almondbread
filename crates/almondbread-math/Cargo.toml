[package]
name = "almondbread-math"
description = "Arbitrary-precision floats, floatexp, reference orbits and reference selection for almondbread"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]

[dev-dependencies]
serde_json = "1"
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"
num-integer = "0.1"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "math"
harness = false

[lints]
workspace = true
