# almondbread Rust core (kb: decisions/rust-core).
#
#   almondbread-math    arbitrary precision, floatexp, reference orbit, reference selection
#   almondbread-core    viewport, settings, palettes, navigation, CPU oracle, verify metrics
#   almondbread-render  GPU-backend trait, chunked scheduler, MSL kernels, Metal backend
#   almondbread-cli     the `almondbread` binary: headless render / verify / bench / regress
#   almondbread-ffi     UniFFI surface for the Swift UI (staticlib in AlmondbreadCore.xcframework)
#   uniffi-bindgen      the bindings generator binary used by scripts/build-rust-xcframework.sh
#
# math and core stay platform-neutral: they must build for Apple, Linux and Windows targets.
[workspace]
resolver = "3"
members = [
    "crates/almondbread-math",
    "crates/almondbread-core",
    "crates/almondbread-render",
    "crates/almondbread-cli",
    "crates/almondbread-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.91"

[workspace.dependencies]
almondbread-math = { path = "crates/almondbread-math" }
almondbread-core = { path = "crates/almondbread-core" }
almondbread-render = { path = "crates/almondbread-render" }
uniffi = "0.32"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Limb arithmetic indexes several slices in lock-step; iterator rewrites hurt readability.
needless_range_loop = "allow"
# Hang prevention (kb: techniques/hang-prevention): loops whose end depends on computed values.
# `infinite_iter` is deny by default already; the others are pedantic / nursery / restriction.
infinite_iter = "deny"
maybe_infinite_iter = "warn"
while_float = "warn"
infinite_loop = "warn"
recursive_format_impl = "deny"

# Two optimised profiles (decided 2026-10-26). `release` is for working: tests, the CLI, clippy.
# Fully optimised code but no whole-program LTO, parallel codegen and incremental, so a one-line
# change in the render crate rebuilds in seconds instead of ~5 minutes; tests run as fast.
# `dist` is what ships and what benchmarks measure: `make rust` (the app's static libs),
# `make bench` / `flight-bench`. Fat LTO is ~10% faster on CPU reference orbits.
[profile.release]
lto = false
codegen-units = 16
incremental = true
# panic stays "unwind": UniFFI catches panics at the boundary and raises them as Swift
# errors; "abort" would take the app down on any precondition failure.
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

[profile.bench]
inherits = "dist"
