[package]
name = "landscape-rt"
version = "0.1.0"
edition = "2024"
publish = false
description = "L1 prototype: real-time flight over the Mandelbrot set as 2.5D terrain (Metal, geometry clipmaps)"

# Own workspace root so the repository's root workspace does not claim this crate.
[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
bytemuck = { version = "1.16", features = ["derive"] }
winit = "0.30"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", features = ["block2"] }
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
