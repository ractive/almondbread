dir = "kb/wiki"
format = "text"
site_prefix = ""
validate_on_write = true

[schema]
exempt = ["**/index.md", "**/log.md"]

[schema.default]
required = ["title", "type"]

# Mark this vault as OKF-flavoured so plain `hyalo lint` runs the OKF §9
# conformance rules (advisory citation / reserved-file / augmentation checks)
# without needing `--profile okf` on every invocation. `hyalo lint --profile
# okf` on such a vault is then a no-op overlay (idempotent).
[lint]
profiles = ["okf"]
# Pages that cite no source at all (decision records, meta pages, one source
# page about local tool output). OKF-CITATIONS-PRESENT cannot be met for them
# without inventing a citation, and hyalo has no per-file rule switch (OKF
# rules ignore markdownlint-disable comments). Naming a file still lints it
# fully: `hyalo lint roadmap.md`. Drop a page from this list once it cites a
# source and has a `# Citations` section.
ignore = [
  "decisions/app-stack.md",
  "decisions/arbitrary-precision.md",
  "decisions/landscape-mode.md",
  "decisions/open-source-release.md",
  "decisions/rust-core.md",
  "ideas.md",
  "overview.md",
  "roadmap.md",
  "sources/apple-device-tooling.md",
]

[schema.types.source]
required = ["title", "type", "authors", "year", "raw", "status", "tags"]

[schema.types.source.properties.status]
type = "enum"
values = ["unread", "skimmed", "digested"]

# Recommended OKF properties (declared as optional so authoring is not blocked,
# but type-checked when present).
[schema.default.properties.title]
type = "string"

[schema.types.source.properties.year]
type = "number"

[schema.default.properties.description]
type = "string"

[schema.types.source.properties.authors]
type = "list"

[schema.default.properties.resource]
type = "string"
pattern = "^\\w[\\w+.-]*://"

[schema.types.source.properties.tags]
type = "list"

[schema.default.properties.tags]
type = "list"

[schema.types.technique]
required = ["title", "type", "status", "sources", "tags"]

[schema.default.properties.timestamp]
type = "datetime-tz"

[schema.types.technique.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.technique.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.technique.properties.tags]
type = "list"

[schema.types.formula]
required = ["title", "type", "status", "sources", "tags"]

[schema.types.formula.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.formula.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.formula.properties.tags]
type = "list"

[schema.types.implementation]
required = ["title", "type", "status", "tags"]

[schema.types.implementation.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.implementation.properties.license]
type = "string"

[schema.types.implementation.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.implementation.properties.tags]
type = "list"

[schema.types.platform]
required = ["title", "type", "status", "sources", "tags"]

[schema.types.platform.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.platform.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.platform.properties.tags]
type = "list"

[schema.types.question]
required = ["title", "type", "status", "tags"]

[schema.types.question.properties.status]
type = "enum"
values = ["open", "answered"]

[schema.types.question.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.question.properties.tags]
type = "list"

[schema.types.decision]
required = ["title", "type", "date", "status", "tags"]

[schema.types.decision.properties.status]
type = "enum"
values = ["proposed", "accepted", "superseded"]

[schema.types.decision.properties.date]
type = "date"

[schema.types.decision.properties.tags]
type = "list"

[schema.types.synthesis]
required = ["title", "type", "date", "sources", "tags"]

[schema.types.synthesis.properties.date]
type = "date"

[schema.types.synthesis.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.synthesis.properties.tags]
type = "list"

[schema.types.plan]
required = ["title", "type", "milestone", "status", "priority", "effort"]
required_sections = ["## Goal", "## Scope", "## Non-goals", "## Design sketch", "## Affected modules", "## Verification", "## Review gate", "## Risks", "## Open questions", "## Effort breakdown"]

[schema.types.plan.properties.milestone]
type = "string"
pattern = "^[A-Z0-9][A-Za-z0-9.-]*$"

[schema.types.plan.properties.status]
type = "enum"
values = ["proposed", "planned", "in-progress", "done", "dropped"]

[schema.types.plan.properties.priority]
type = "number"

[schema.types.plan.properties.effort]
type = "enum"
values = ["S", "M", "L", "XL"]

[schema.types.plan.properties.appeal]
type = "enum"
values = ["low", "medium", "high"]

[schema.types.plan.properties.audience]
type = "string-list"
item_pattern = "^(casual|education|artists|deep-zoom-creators|enthusiasts|developers)$"

[schema.types.plan.properties.depth]
type = "string"

[schema.types.plan.properties.realtime-ipad]
type = "enum"
values = ["yes", "no", "likely", "unknown"]

[schema.types.plan.properties.reuse]
type = "string"

[schema.types.plan.properties.depends-on]
type = "string-list"
item_pattern = "^\\[\\[plans/[a-z0-9-]+\\]\\]$"

[schema.types.plan.properties.risks]
type = "list"

[schema.types.plan.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[[a-z0-9-]+(/[a-z0-9-]+)*\\]\\]$"

[schema.types.plan.properties.tags]
type = "list"

[schema.types.plan.properties.created]
type = "date"

[schema.types.plan.properties.updated]
type = "date"

[schema.types.meta]
required = ["title", "type"]

[views.stubs]
properties = ["status=stub"]

[views.unread]
properties = ["type=source", "status=unread"]

[views.open-questions]
properties = ["type=question", "status=open"]

[views.orphans]
orphan = true

[views.plans]
fields = ["title", "properties"]
properties = ["type=plan"]
sort = "property:priority"

