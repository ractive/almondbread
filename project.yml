# XcodeGen spec: `xcodegen` generates Almondbread.xcodeproj (not checked in).
# The app code lives in the AlmondbreadKit package; these targets are thin shells around it.
name: Almondbread
options:
  bundleIdPrefix: ch.ractive
  minimumXcodeGenVersion: 2.45.1   # the first that compiles .icon (Apps/AppIcon.icon); older ones copy it as a folder
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
packages:
  Almondbread:
    path: .
targets:
  Almondbread:
    type: application
    platform: macOS
    sources:
      - Apps/macOS
      - Apps/AppIcon.icon   # scripts/app-icon.py; Xcode compiles it
    dependencies:
      - package: Almondbread
        product: AlmondbreadKit
      - package: Almondbread
        product: AlmondbreadCore   # Rust core via build/rust/AlmondbreadCoreFFI.xcframework (make rust)
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Almondbread
        CFBundleName: Almondbread
        # XcodeGen writes "1.0" / "1" unless told; the release sets both from the tag.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.graphics-design
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.ractive.almondbread
        PRODUCT_NAME: Almondbread
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"        # ad-hoc: runs locally without a developer account
        ENABLE_HARDENED_RUNTIME: NO
  Almondbread iOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - Apps/AppIcon.icon
    dependencies:
      - package: Almondbread
        product: AlmondbreadKit
      - package: Almondbread
        product: AlmondbreadCore   # Rust core via build/rust/AlmondbreadCoreFFI.xcframework (make rust)
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Almondbread
        CFBundleName: Almondbread
        # XcodeGen writes "1.0" / "1" unless told; the release sets both from the tag.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        # SwiftUI's statusBarHidden() on the canvas did not hide it (simulator, iOS 26.5):
        # hide it app-wide.
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [metal]
        CADisableMinimumFrameDurationOnPhone: true   # allow 120 Hz on ProMotion iPhones
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.ractive.almondbread    # one ID for Mac and iOS: Universal Purchase
        PRODUCT_NAME: Almondbread
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO       # simulator builds; set a team to run on a device
  # Touch gestures and buttons on the simulators (`make ios-uitest`): XCTest synthesises real
  # UIKit touches; correctness and layout only (simulator Metal is not representative).
  Almondbread iOS UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/iOSUITests]
    dependencies:
      - target: Almondbread iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.ractive.almondbread.uitests
        TEST_TARGET_NAME: Almondbread iOS
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  Almondbread iOS:
    build:
      targets:
        Almondbread iOS: all
    test:
      targets: [Almondbread iOS UITests]
